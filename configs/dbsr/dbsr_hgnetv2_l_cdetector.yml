__include__: [
  '../dataset/cdetectord_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/dbsr_hgnetv2.yml',
]

output_dir: output/dbsr_hgnetv2_l_cdetector/self_attn/加vpe加fusion/token8


HGNetv2:
  name: 'B4'
  return_idx: [1, 2, 3]
  freeze_stem_only: True
  freeze_at: 0
  freeze_norm: True

VisualClassifier:
  num_classes: 11
  num_decoder_layers: 4
  num_tokens: 8   # 1 4 8 16
  text_feats_path: /root/userfolder/Dataset/ObjectDetection/ComparisonDetectorDataset/pubmed_text11_new_feats.pt

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.000025
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.

  lr: 0.00025
  betas: [0.9, 0.999]
  weight_decay: 0.000125


# Increase to search for the optimal ema
epochs: 100  # 72 + 2n
train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 72
  collate_fn:
    stop_epoch: 72
    ema_restart_decay: 0.9999
    base_size_repeat: 4

checkpoint_freq: 2
print_freq: 100