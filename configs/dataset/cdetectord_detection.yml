task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

# num_classes: 10
num_classes: 11
remap_mscoco_category: False

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /root/userfolder/Dataset/ObjectDetection/ComparisonDetectorDataset/train
    ann_file: /root/userfolder/Dataset/ObjectDetection/ComparisonDetectorDataset/train_intid_label0.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction


val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /root/userfolder/Dataset/ObjectDetection/ComparisonDetectorDataset/test
    ann_file: /root/userfolder/Dataset/ObjectDetection/ComparisonDetectorDataset/test_intid_label0.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
